# syn settings for this repository (see docs/WHAT-EACH-PIECE-IS-FOR.md). Every key has a default; a key here overrides it.
# The keys, by command, are documented in the command's class comment and in tools/syn/README.md.

# script-check-ceiling: the manifest that holds the shell/Python high-water mark.
ceiling.manifest=scripts/legacy-scripts.tsv

# script-check-conventions: the agent instruction file and its size limit.
conventions.instruction-file=AGENTS.md
conventions.instruction-max-chars=12000

# script-check-conventions and script-list-catalog treat every script under scripts/ as a command-like library script, with a
# header and --help. A sourced environment file is configuration, not a command, so it is exempt.
catalog.script-exempt=scripts/myEnv.sh
